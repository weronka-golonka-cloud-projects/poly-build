name: Terraform Destroy with Approval

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Confirm to destroy infrastructure? (yes/no)'
        required: true
        default: 'no'

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup AWS access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_REPO_IAM_ROLE_ARN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          approvers: user1,user2
          issue-title: 'Approval for Terraform Destroy'
          issue-body: 'Please approve or deny the destruction of infrastructure. The plan is available as workflow artifact.'
          fail-on-denial: true

      - name: Terraform Destroy
        if: ${{ github.event.inputs.confirm_destroy == 'yes' }}
        run: terraform destroy -auto-approve
